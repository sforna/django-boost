name: update changelog

on:
  release:
    types: [released]

permissions: {}

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update CHANGELOG.md
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          RELEASE_BODY="${{ github.event.release.body }}"
          DATE=$(date +%Y-%m-%d)
          echo -e "## [${RELEASE_TAG}](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${RELEASE_TAG}) - ${DATE}\n\n${RELEASE_BODY}\n\n$(cat CHANGELOG.md)" > CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${RELEASE_TAG}" || true
          git push

name: tests

on:
  push:
    branches: [master]
    paths-ignore: ['*.md', 'LICENSE']
  pull_request:
    paths-ignore: ['*.md', 'LICENSE']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          pip install --upgrade pip
          pip install "django>=5.0"
          pip install -e ".[dev]"

      - name: Test
        run: pytest tests/ -v --tb=short

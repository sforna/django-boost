name: lint

on:
  push:
    branches: [master]
    paths-ignore: ['*.md', 'LICENSE']
  pull_request:
    paths-ignore: ['*.md', 'LICENSE']

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
